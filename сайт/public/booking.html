<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Бронирование - SmailAgent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Marck+Script&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="inner-page">
  <header class="header">
    <div class="container nav">
      <a class="logo logo-phone" href="tel:+79628676818">+7 962 867-68-18</a>
      <nav class="menu">
        <a href="./index.html">Главная</a>
        <a href="./portfolio.html">Портфолио</a>
        <a href="./reviews.html">Отзывы</a>
        <a href="./booking.html">Бронирование</a>
        <button id="openAuthBtn" class="btn btn-menu" type="button">Авторизация</button>
        <a id="adminLink" href="./admin.html" style="display:none;">Админ-панель</a>
      </nav>
    </div>
  </header>

  <main class="section container">
    <section class="section">
      <h2 class="about-title booking-title">Конструктор программы</h2>
      <form id="constructorForm" class="card form-grid">
        <label>ФИО
          <input required name="fullName" type="text" placeholder="Иванов Иван Иванович">
        </label>
        <label>Телефон
          <input required name="phone" type="tel" placeholder="+7 (999) 123-45-67">
        </label>
        <label>Дата
          <input required name="date" type="date">
        </label>
        <label>Время
          <input required name="time" type="time">
        </label>
        <label>Адрес
          <input required name="address" type="text" placeholder="г. Москва, ул. Пример, д. 1">
        </label>
        <label>Комментарий
          <textarea name="comment" rows="3" placeholder="Пожелания по программе"></textarea>
        </label>
        <label>Имитация онлайн-оплаты
          <select name="paymentMock" required>
            <option value="card">Карта (демо)</option>
            <option value="sbp">СБП (демо)</option>
          </select>
        </label>
        <div class="total-row">
          <strong>Итого:</strong>
          <span id="totalPrice">0 ₽</span>
        </div>
        <button id="submitOrderBtn" class="btn submit-near-total" type="submit">Забронировать и оплатить</button>
        <div class="animator-block">
          <p class="field-title">Выберите аниматоров:</p>
          <div id="animators" class="animator-cards"></div>
          <div id="animatorEditor" class="animator-editor card" style="display:none;"></div>
        </div>
      </form>
    </section>

    <section class="section">
      <h2 class="about-title booking-title">Календарь занятости</h2>
      <div id="calendar" class="calendar-compact"></div>
    </section>
  </main>

  <div id="authModal" class="modal hidden">
    <div class="modal-backdrop" data-close-modal="true"></div>
    <div class="modal-panel card">
      <button id="closeAuthBtn" class="modal-close" type="button">×</button>
      <h2>Авторизация</h2>
      <div class="auth-grid">
        <form id="registerForm" class="card">
          <h3>Регистрация клиента</h3>
          <label>Логин
            <input required name="login" type="text" minlength="4">
          </label>
          <label>Пароль
            <input required name="password" type="password" minlength="6">
          </label>
          <button class="btn" type="submit">Зарегистрироваться</button>
        </form>
        <form id="loginForm" class="card">
          <h3>Вход</h3>
          <label>Логин
            <input required name="login" type="text">
          </label>
          <label>Пароль
            <input required name="password" type="password">
          </label>
          <button class="btn" type="submit">Войти</button>
          <button id="logoutBtn" class="btn btn-secondary" type="button">Выйти</button>
        </form>
      </div>
      <p id="sessionInfo" class="section-text"></p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.15/index.global.min.js"></script>
  <script src="./app.js"></script>
</body>
</html>
